<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy New Year 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
/* ===== GIỮ NGUYÊN TOÀN BỘ CSS ===== */
body{
    margin:0; padding:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#000; color:white;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    height:100vh; overflow:hidden;
}
#title{display:flex;gap:5px;justify-content:center;font-weight:bold;z-index:10}
#title span{
    font-size:4em;
    opacity:0;
    color:#0ff;
    text-shadow:0 0 5px #0ff,0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff;
    transition:.3s;
    cursor:pointer
}
#title span:hover{color:hsl(var(--hue),100%,70%)}

.year{display:flex;gap:20px;z-index:10}
.year span{
    font-size:6em;
    font-weight:bold;
    background:linear-gradient(45deg,#ff004c,#ff8a00,#fffc00,#00ff85);
    background-size:400% 400%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 10px #fff;
    animation:rainbow 4s infinite,bounce 1.5s infinite
}
@keyframes rainbow{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}
@keyframes bounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-20px)}
}

button{
    padding:14px 26px;
    font-size:1.1em;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:linear-gradient(45deg,#ff004c,#ff8a00,#fffc00,#00ff85);
    color:white;
    margin:15px 0;
    z-index:10
}

.letter{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0);
    width:90%;
    max-width:600px;
    height:70vh;
    background:#fff8e1;
    border-radius:20px;
    padding:20px;
    z-index:20;
    transition:.4s ease;
    display:flex;
    flex-direction:column
}
.letter.show{
    transform:translate(-50%,-50%) scale(1)
}

.paper{
    flex:1;
    overflow-y:auto;
    font-family:'Dancing Script',cursive;
    font-size:20px;
    line-height:32px;
    color:#333;
    padding-right:8px;
    background-image:
      repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 31px,
        #d0d0d0 32px
      );
    white-space:pre-line;
    scroll-behavior:smooth;
}

.signature{
    margin-top:10px;
    font-family:'Great Vibes',cursive;
    font-size:32px;
    color:#000;
    text-align:right;
    width:0;
    overflow:hidden;
    white-space:nowrap;
    border-right:2px solid rgba(0,0,0,.6)
}
.signature.show{
    animation:sign 2.5s steps(30,end) forwards
}
@keyframes sign{
    to{width:100%}
}

.bubble{
    position:absolute;
    bottom:-40px;
    border-radius:50%;
    opacity:.5;
    animation:rise linear forwards
}
@keyframes rise{
    to{
        transform:translateY(-120vh);
        opacity:0
    }
}

canvas{
    position:absolute;
    inset:0;
    z-index:0
}
</style>
</head>

<body>

<div id="title"></div>
<div class="year"></div>

<button id="openLetter">Mở Thư 💌</button>

<div class="letter" id="letter">
    <div class="paper" id="paper"></div>
    <div class="signature" id="sign">— VoDat —</div>
    <button onclick="closeLetter()">Đóng Thư</button>
</div>

<audio id="music" loop>
    <source src="https://files.catbox.moe/fom97r.mp4" type="audio/mpeg">
</audio>

<canvas id="fireworks"></canvas>

<script>
/* ===== KHAI BÁO BIẾN (FIX LỖI THIẾU) ===== */
const openLetter = document.getElementById("openLetter");
const letter = document.getElementById("letter");

/* ===== TITLE GIỮ NGUYÊN 100% ===== */
const titleText="HAPPY NEW YEAR";
const yearText="2026";
const title=document.getElementById("title");
const year=document.querySelector(".year");

titleText.split("").forEach(c=>{
    const s=document.createElement("span");
    s.textContent=c;
    title.appendChild(s);
});
yearText.split("").forEach(c=>{
    const s=document.createElement("span");
    s.textContent=c;
    year.appendChild(s);
});

function typeEffect(container,speed){
    const spans=container.querySelectorAll("span");
    let i=0;
    (function run(){
        if(i<spans.length){
            spans[i].style.opacity=1;
            spans[i].addEventListener("mouseover",()=>{
                spans[i].style.setProperty("--hue",Math.random()*360);
            });
            i++;
            setTimeout(run,speed);
        }
    })();
}
typeEffect(title,150);
setTimeout(()=>typeEffect(year,200),1500);

/* ===== NỘI DUNG THƯ (DÀI + GỌN + TRÊN DÒNG KẺ) ===== */
const msg=[
"🎉 Chúc mừng Năm Mới 2026 🎉",
"",
"Một năm cũ đã khép lại,",
"mang theo biết bao kỷ niệm vui buồn.",
"Có những ngày rực rỡ ánh nắng,",
"cũng có những ngày lặng thầm suy nghĩ.",
"",
"Bước sang năm mới 2026,",
"chúc em luôn mạnh khỏe,",
"luôn bình an giữa cuộc sống bộn bề.",
"",
"Mong rằng mỗi buổi sáng thức dậy,",
"em có đủ năng lượng để mỉm cười,",
"đủ niềm tin để bước tiếp con đường mình chọn.",
"",
"Chúc cho những ước mơ nhỏ bé",
"sẽ dần trở nên rõ ràng hơn.",
"Những cố gắng âm thầm",
"sẽ được đền đáp xứng đáng.",
"",
"Năm 2026,",
"mong em học được cách yêu bản thân nhiều hơn,",
"sống chậm lại một chút,",
"và trân trọng những điều giản dị quanh mình.",
"",
"Dù cuộc sống có thay đổi thế nào,",
"chỉ mong em luôn giữ được",
"một trái tim ấm áp",
"và một nụ cười thật chân thành.",
"",
"Chúc cho mỗi ngày trôi qua",
"đều là một ngày đáng nhớ.",
"Đủ bình yên để sống,",
"đủ yêu thương để hạnh phúc.",
"",
"HAPPY NEW YEAR 2026 🥳",
"",
"Một năm mới an lành,",
"tràn ngập niềm vui,",
"yêu thương và hy vọng 💖"
];

const paper=document.getElementById("paper");
const sign=document.getElementById("sign");
const music=document.getElementById("music");

let i=0,j=0;

function write(){
    if(i>=msg.length){
        sign.classList.add("show");
        return;
    }
    if(j<msg[i].length){
        paper.innerHTML+=msg[i][j++];
        paper.scrollTop=paper.scrollHeight;
        setTimeout(write,35);
    }else{
        paper.innerHTML+="\n";
        i++; j=0;
        setTimeout(write,200);
    }
}

openLetter.onclick=()=>{
    letter.classList.add("show");
    paper.innerHTML="";
    sign.classList.remove("show");
    i=j=0;
    write();
    music.play();
};

function closeLetter(){
    letter.classList.remove("show");
    music.pause();
    music.currentTime=0;
}

/* ===== BUBBLE ===== */
setInterval(()=>{
    const b=document.createElement("div");
    const s=Math.random()*25+12;
    b.className="bubble";
    b.style.width=b.style.height=s+"px";
    b.style.left=Math.random()*100+"vw";
    b.style.background=`hsla(${Math.random()*360},100%,70%,.6)`;
    b.style.animationDuration=8+Math.random()*4+"s";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),12000);
},1200);

/* ===== FIREWORK ===== */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let ps=[];
function boom(){
    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height*0.4;
    for(let i=0;i<25;i++){
        ps.push({
            x,y,
            vx:(Math.random()-0.5)*3,
            vy:(Math.random()-0.5)*3,
            life:60,
            c:`hsl(${Math.random()*360},100%,60%)`
        });
    }
}
function ani(){
    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(Math.random()<0.04) boom();
    ps.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;
        p.life--;
        ctx.fillStyle=p.c;
        ctx.globalAlpha=p.life/60;
        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha=1;
    ps=ps.filter(p=>p.life>0);
    requestAnimationFrame(ani);
}
ani();
</script>

</body>
</html>
